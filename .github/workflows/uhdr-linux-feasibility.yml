name: Ultra HDR Linux feasibility

on:
  workflow_dispatch:
  push:
    branches:
      - codex/uhdr-linux-feasibility

permissions:
  contents: read

jobs:
  normalize-fixture:
    name: Build pinned libvips with Ultra HDR and verify SDR output
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UHDR_COMMIT: a8166d65171aef43cb4bc211538ee6619a9af680
      VIPS_COMMIT: 24ad4d042940e6bf99a68871ba886ca8847c9c82
      PKG_CONFIG_PATH: /usr/local/lib/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig
      LD_LIBRARY_PATH: /usr/local/lib:/usr/local/lib/x86_64-linux-gnu
      LC_ALL: C

    steps:
      - name: Check out MOJEAN fixture
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned-build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            git \
            libexpat1-dev \
            libexif-dev \
            libglib2.0-dev \
            libjpeg-dev \
            liblcms2-dev \
            meson \
            ninja-build \
            pkg-config \
            python3

      - name: Build pinned Google libultrahdr
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mojean-uhdr-build"
          cd "$RUNNER_TEMP/mojean-uhdr-build"
          git init libultrahdr
          git -C libultrahdr remote add origin https://github.com/google/libultrahdr.git
          git -C libultrahdr fetch --no-tags --depth=1 origin "$UHDR_COMMIT"
          git -C libultrahdr checkout --detach FETCH_HEAD
          test "$(git -C libultrahdr rev-parse HEAD)" = "$UHDR_COMMIT"
          cmake -S libultrahdr -B libultrahdr/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_SHARED_LIBS=ON \
            -DUHDR_BUILD_DEPS=OFF \
            -DUHDR_BUILD_EXAMPLES=OFF \
            -DUHDR_BUILD_TESTS=OFF
          cmake --build libultrahdr/build --parallel 2
          sudo cmake --install libultrahdr/build
          sudo ldconfig
          test "$(pkg-config --modversion libuhdr)" = "1.5.1"
          pkg-config --modversion libuhdr

      - name: Build pinned libvips with Ultra HDR required
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mojean-uhdr-build"
          git init libvips
          git -C libvips remote add origin https://github.com/libvips/libvips.git
          git -C libvips fetch --no-tags --depth=1 origin "$VIPS_COMMIT"
          git -C libvips checkout --detach FETCH_HEAD
          test "$(git -C libvips rev-parse HEAD)" = "$VIPS_COMMIT"
          meson setup libvips/build libvips \
            --prefix=/usr/local \
            --libdir=lib \
            --buildtype=release \
            --wrap-mode=nofallback \
            -Duhdr=enabled \
            -Djpeg=enabled \
            -Dlcms=enabled \
            -Dexif=enabled \
            -Dmodules=disabled \
            -Dintrospection=disabled \
            -Dpng=disabled \
            -Dspng=disabled \
            -Dwebp=disabled \
            -Dtiff=disabled \
            -Dheif=disabled \
            -Dopenjpeg=disabled \
            -Dopenexr=disabled \
            -Dmagick=disabled \
            -Darchive=disabled \
            -Dfftw=disabled \
            -Dimagequant=disabled \
            -Dcgif=disabled \
            -Dpdfium=disabled \
            -Dpoppler=disabled \
            -Drsvg=disabled \
            -Dmatio=disabled \
            -Dnifti=disabled \
            -Dcfitsio=disabled \
            -Dopenslide=disabled \
            -Draw=disabled
          meson compile -C libvips/build --jobs 2
          sudo meson install -C libvips/build
          sudo ldconfig
          test "$(vips --version)" = "vips-8.18.7"
          test "$(pkg-config --modversion libuhdr)" = "1.5.1"
          vips --version
          pkg-config --modversion libuhdr
          meson configure libvips/build

      - name: Decode fixture, normalize, and verify output
        env:
          FIXTURE: ${{ github.workspace }}/public/image-diagnostic/original-ultra-hdr.jpg
          OUTPUT_DIR: ${{ runner.temp }}/mojean-uhdr-feasibility
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          cat > "$RUNNER_TEMP/verify_uhdr_spike.py" <<'PY'
          import base64
          import hashlib
          import json
          import math
          import os
          import re
          import resource
          import struct
          import subprocess
          import sys
          import time
          from pathlib import Path

          FIXTURE = Path(os.environ["FIXTURE"])
          OUTPUT_DIR = Path(os.environ["OUTPUT_DIR"])
          OUTPUT = OUTPUT_DIR / "mojean-ultrahdr-sdr-srgb.jpg"
          REPORT = OUTPUT_DIR / "report.json"
          EXPECTED_FIXTURE_SHA256 = "AD1AF749A664AECAA3BF8D62E30D2244C7B1E939BB77ACF4FBD5FFDF8C17F74B"
          MAX_INPUT_BYTES = 10 * 1024 * 1024
          MAX_PIXELS = 10_000_000
          MAX_SIDE = 8192
          RLIMIT_AS_BYTES = 1536 * 1024 * 1024
          RLIMIT_CPU_SECONDS = 120
          COMMAND_TIMEOUT_SECONDS = 150
          report = {
              "status": "failed",
              "runner": "ubuntu-24.04",
              "pinnedCommits": {
                  "libultrahdr": os.environ["UHDR_COMMIT"],
                  "libvips": os.environ["VIPS_COMMIT"],
              },
              "limits": {
                  "jobTimeoutMinutes": 30,
                  "maxInputBytes": MAX_INPUT_BYTES,
                  "maxPixels": MAX_PIXELS,
                  "maxSidePixels": MAX_SIDE,
                  "libvipsConcurrency": 2,
                  "processVirtualAddressSpaceBytes": RLIMIT_AS_BYTES,
                  "processCpuSeconds": RLIMIT_CPU_SECONDS,
                  "commandWallTimeoutSeconds": COMMAND_TIMEOUT_SECONDS,
              },
          }
          started = time.monotonic()

          def set_child_limits():
              resource.setrlimit(resource.RLIMIT_AS, (RLIMIT_AS_BYTES, RLIMIT_AS_BYTES))
              resource.setrlimit(resource.RLIMIT_CPU, (RLIMIT_CPU_SECONDS, RLIMIT_CPU_SECONDS))

          def run(command, *, limited=True):
              env = os.environ.copy()
              env["VIPS_CONCURRENCY"] = "2"
              env["OMP_NUM_THREADS"] = "2"
              completed = subprocess.run(
                  command,
                  check=True,
                  capture_output=True,
                  text=True,
                  env=env,
                  timeout=COMMAND_TIMEOUT_SECONDS if limited else 60,
                  preexec_fn=set_child_limits if limited else None,
              )
              return completed.stdout.strip()

          def parse_vips_header(path):
              text = run(["vipsheader", "-a", str(path)])
              first = text.splitlines()[0]
              match = re.search(r"(\d+)x(\d+)\s+(\w+),\s*(\d+)\s+bands,\s*([^,\r\n]+)", first)
              if not match:
                  raise RuntimeError(f"Could not parse libvips header: {first}")
              def field(name):
                  found = re.search(rf"^{re.escape(name)}:\s*(.+)$", text, re.MULTILINE)
                  return found.group(1).strip() if found else None
              return {
                  "width": int(match.group(1)),
                  "height": int(match.group(2)),
                  "sampleFormat": match.group(3),
                  "bands": int(match.group(4)),
                  "interpretation": match.group(5).strip(),
                  "loader": field("vips-loader"),
                  "iccProfileBytes": field("icc-profile-data"),
                  "gainMapBytes": field("gainmap-data"),
                  "orientation": field("exif-ifd0-Orientation"),
                  "hasExif": field("exif-data") is not None,
              }

          def jpeg_segments(path, allow_trailing_padding=False):
              data = path.read_bytes()
              if len(data) < 4 or data[:2] != b"\xff\xd8":
                  raise RuntimeError("Output does not start with JPEG SOI")
              if allow_trailing_padding:
                  end = len(data)
                  while end > 0 and data[end - 1] == 0:
                      end -= 1
                  if data[end - 2:end] != b"\xff\xd9":
                      raise RuntimeError("Output does not contain JPEG EOI")
              elif data[-2:] != b"\xff\xd9":
                  raise RuntimeError("Output does not end with JPEG EOI")
              segments = []
              offset = 2
              dimensions = None
              sof = {0xC0, 0xC1, 0xC2, 0xC3, 0xC5, 0xC6, 0xC7, 0xC9, 0xCA, 0xCB, 0xCD, 0xCE, 0xCF}
              while offset < len(data):
                  if data[offset] != 0xFF:
                      raise RuntimeError("Invalid JPEG marker sequence before scan data")
                  while offset < len(data) and data[offset] == 0xFF:
                      offset += 1
                  if offset >= len(data):
                      break
                  marker = data[offset]
                  offset += 1
                  if marker in (0xD9, 0xDA):
                      break
                  if marker == 0x01 or 0xD0 <= marker <= 0xD7:
                      continue
                  if offset + 2 > len(data):
                      raise RuntimeError("Truncated JPEG segment length")
                  length = struct.unpack_from(">H", data, offset)[0]
                  if length < 2 or offset + length > len(data):
                      raise RuntimeError("Invalid or truncated JPEG segment")
                  payload = data[offset + 2:offset + length]
                  if marker in sof:
                      if len(payload) < 5:
                          raise RuntimeError("Truncated JPEG frame header")
                      height, width = struct.unpack_from(">HH", payload, 1)
                      dimensions = {"width": width, "height": height}
                  segments.append((marker, payload))
                  offset += length
              if not dimensions:
                  raise RuntimeError("JPEG frame dimensions not found")
              return data, segments, dimensions

          def metadata_flags(segments):
              xmp_payloads = []
              icc_parts = {}
              icc_count = None
              result = {"exif": False, "xmp": False, "mpf": False, "icc": False, "iso21496": False, "gainMap": False}
              for marker, payload in segments:
                  lower = payload.lower()
                  if marker == 0xE1 and payload.startswith(b"Exif\0\0"):
                      result["exif"] = True
                  if marker == 0xE1 and (payload.startswith(b"http://ns.adobe.com/xap/1.0/") or payload.startswith(b"http://ns.adobe.com/xmp/extension/")):
                      result["xmp"] = True
                      xmp_payloads.append(lower)
                  if marker == 0xE2 and payload.startswith(b"MPF\0"):
                      result["mpf"] = True
                  if marker == 0xE2 and payload.startswith(b"ICC_PROFILE\0"):
                      result["icc"] = True
                      if len(payload) < 14:
                          raise RuntimeError("Truncated ICC APP2 segment")
                      sequence, count = payload[12], payload[13]
                      if sequence == 0 or count == 0 or sequence > count or (icc_count is not None and icc_count != count):
                          raise RuntimeError("Malformed ICC APP2 sequence")
                      icc_count = count
                      icc_parts[sequence] = payload[14:]
                  if b"21496" in lower or b"iso:std:iso:ts:21496" in lower:
                      result["iso21496"] = True
                  if any(marker_text in lower for marker_text in (b"hdrgm", b"gainmap", b"hdr-gain-map")):
                      result["gainMap"] = True
              profile = None
              if result["icc"]:
                  if icc_count != len(icc_parts) or sorted(icc_parts) != list(range(1, icc_count + 1)):
                      raise RuntimeError("Incomplete ICC profile APP2 sequence")
                  profile = b"".join(icc_parts[i] for i in range(1, icc_count + 1))
              return result, profile

          def icc_description(profile):
              if len(profile) < 132 or profile[36:40] != b"acsp":
                  raise RuntimeError("Embedded ICC profile is malformed")
              if profile[16:20] != b"RGB ":
                  raise RuntimeError(f"Unexpected ICC color space {profile[16:20]!r}")
              count = struct.unpack_from(">I", profile, 128)[0]
              for index in range(count):
                  record = 132 + index * 12
                  signature = profile[record:record + 4]
                  offset, size = struct.unpack_from(">II", profile, record + 4)
                  if signature != b"desc" or offset + size > len(profile):
                      continue
                  kind = profile[offset:offset + 4]
                  if kind == b"mluc" and size >= 28:
                      entries, record_size = struct.unpack_from(">II", profile, offset + 8)
                      if entries and record_size >= 12:
                          entry = offset + 16
                          text_size, text_offset = struct.unpack_from(">II", profile, entry + 4)
                          return profile[offset + text_offset:offset + text_offset + text_size].decode("utf-16-be").rstrip("\0")
                  if kind == b"desc" and size >= 12:
                      text_size = struct.unpack_from(">I", profile, offset + 8)[0]
                      return profile[offset + 12:offset + 12 + text_size].split(b"\0", 1)[0].decode("ascii", "replace")
              return None

          try:
              if not FIXTURE.is_file():
                  raise RuntimeError(f"Fixture is missing: {FIXTURE}")
              source_bytes = FIXTURE.stat().st_size
              if source_bytes <= 0 or source_bytes > MAX_INPUT_BYTES:
                  raise RuntimeError(f"Fixture size is outside the {MAX_INPUT_BYTES}-byte limit")
              source_hash = hashlib.sha256(FIXTURE.read_bytes()).hexdigest().upper()
              if source_hash != EXPECTED_FIXTURE_SHA256:
                  raise RuntimeError(f"Fixture SHA-256 mismatch: {source_hash}")

              versions = {
                  "libvips": run(["vips", "--version"], limited=False),
                  "libultrahdr": run(["pkg-config", "--modversion", "libuhdr"], limited=False),
                  "meson": run(["meson", "--version"], limited=False),
                  "cmake": run(["cmake", "--version"], limited=False).splitlines()[0],
              }
              if versions["libvips"] != "vips-8.18.7" or versions["libultrahdr"] != "1.5.1":
                  raise RuntimeError(f"Unexpected native versions: {versions}")
              loader_list = run(["vips", "-l", "foreign"])
              if "uhdrload" not in loader_list.lower():
                  raise RuntimeError("libvips foreign loaders do not list uhdrload")
              source_header = parse_vips_header(FIXTURE)
              if source_header["loader"] != "uhdrload" or not source_header["gainMapBytes"]:
                  raise RuntimeError(f"Pinned runtime did not decode this fixture as Ultra HDR: {source_header}")
              if not source_header["iccProfileBytes"]:
                  raise RuntimeError("Fixture has no embedded ICC profile")
              if source_header["width"] != 2420 or source_header["height"] != 3420:
                  raise RuntimeError(f"Unexpected fixture dimensions: {source_header}")
              if source_header["width"] > MAX_SIDE or source_header["height"] > MAX_SIDE or source_header["width"] * source_header["height"] > MAX_PIXELS:
                  raise RuntimeError("Fixture exceeds dimension/pixel safety limits")
              _, source_segments, _ = jpeg_segments(FIXTURE, allow_trailing_padding=True)
              source_metadata, _ = metadata_flags(source_segments)
              if not source_metadata["gainMap"] or not source_metadata["xmp"]:
                  raise RuntimeError(f"Fixture marker check did not confirm Ultra HDR metadata: {source_metadata}")

              oriented = OUTPUT_DIR / "oriented.v"
              srgb = OUTPUT_DIR / "srgb.v"
              t0 = time.monotonic()
              run(["vips", "autorot", str(FIXTURE), str(oriented)])
              oriented_header = parse_vips_header(oriented)
              run(["vips", "icc_transform", str(oriented), str(srgb), "srgb", "--embedded", "--input-profile", "srgb"])
              run(["vips", "jpegsave", str(srgb), str(OUTPUT), "--Q", "92", "--optimize-coding", "--keep", "icc"])
              conversion_wall_seconds = round(time.monotonic() - t0, 3)

              if not OUTPUT.is_file():
                  raise RuntimeError("JPEG encoder did not create the output")
              output_bytes = OUTPUT.stat().st_size
              if output_bytes <= 0 or output_bytes > MAX_INPUT_BYTES:
                  raise RuntimeError("Normalized output is empty or exceeds the 10 MiB output cap")
              output_hash = hashlib.sha256(OUTPUT.read_bytes()).hexdigest().upper()
              output_header = parse_vips_header(OUTPUT)
              output_data, output_segments, jpeg_dimensions = jpeg_segments(OUTPUT)
              output_metadata, profile = metadata_flags(output_segments)
              if output_header["loader"] != "jpegload":
                  raise RuntimeError(f"Output did not reopen through the ordinary JPEG loader: {output_header}")
              if output_header["sampleFormat"] != "uchar" or output_header["bands"] != 3:
                  raise RuntimeError(f"Output is not an 8-bit, three-channel SDR JPEG: {output_header}")
              if output_header["interpretation"].lower() != "srgb" or not output_header["iccProfileBytes"]:
                  raise RuntimeError("libvips does not report an embedded sRGB output profile")
              if not profile:
                  raise RuntimeError("Output JPEG has no complete embedded ICC profile")
              profile_name = icc_description(profile)
              if profile_name != "sRGB":
                  raise RuntimeError(f"Embedded ICC profile is not named sRGB: {profile_name!r}")
              if jpeg_dimensions != {"width": oriented_header["width"], "height": oriented_header["height"]}:
                  raise RuntimeError(f"JPEG dimensions do not match autorotated source: {jpeg_dimensions} vs {oriented_header}")
              if output_header["hasExif"] or output_header["orientation"] or output_metadata["exif"]:
                  raise RuntimeError("Output retains EXIF/orientation metadata")
              forbidden = {key: output_metadata[key] for key in ("xmp", "mpf", "iso21496", "gainMap")}
              if any(forbidden.values()) or output_header["gainMapBytes"]:
                  raise RuntimeError(f"Output retains Ultra HDR/gain-map metadata: {forbidden}")
              average = float(run(["vips", "avg", str(OUTPUT)]))
              if not math.isfinite(average):
                  raise RuntimeError("Output full-decode average is not finite")

              usage = resource.getrusage(resource.RUSAGE_CHILDREN)
              report.update({
                  "status": "passed",
                  "versions": versions,
                  "source": {
                      "fixture": "public/image-diagnostic/original-ultra-hdr.jpg",
                      "sha256": source_hash,
                      "bytes": source_bytes,
                      "format": "jpeg",
                      "loader": source_header["loader"],
                      "width": source_header["width"],
                      "height": source_header["height"],
                      "exifOrientation": source_header["orientation"],
                      "iccProfilePresent": True,
                      "gainMapMetadataPresent": True,
                      "xmpMetadataPresent": source_metadata["xmp"],
                  },
                  "output": {
                      "file": OUTPUT.name,
                      "sha256": output_hash,
                      "bytes": output_bytes,
                      "format": "jpeg",
                      "dynamicRange": "SDR",
                      "loader": output_header["loader"],
                      "sampleFormat": output_header["sampleFormat"],
                      "bands": output_header["bands"],
                      "width": jpeg_dimensions["width"],
                      "height": jpeg_dimensions["height"],
                      "orientationApplied": True,
                      "orientationMetadataPresent": False,
                      "iccProfilePresent": True,
                      "iccProfileName": profile_name,
                      "iccProfileColorSpace": profile[16:20].decode("ascii").strip(),
                      "iccProfileBytes": len(profile),
                      "fullyDecoded": True,
                      "fullDecodeAverage": average,
                      "metadata": output_metadata,
                  },
                  "measurements": {
                      "conversionWallSeconds": conversion_wall_seconds,
                      "childPeakRssKiB": usage.ru_maxrss,
                      "childCpuSeconds": round(usage.ru_utime + usage.ru_stime, 3),
                  },
              })
          except Exception as error:
              report["failure"] = f"{type(error).__name__}: {error}"
              raise
          finally:
              report["elapsedSeconds"] = round(time.monotonic() - started, 3)
              REPORT.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          python3 "$RUNNER_TEMP/verify_uhdr_spike.py"

      - name: Upload normalized JPEG and machine-readable report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mojean-uhdr-linux-feasibility-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mojean-uhdr-feasibility/mojean-ultrahdr-sdr-srgb.jpg
            ${{ runner.temp }}/mojean-uhdr-feasibility/report.json
          if-no-files-found: ignore
          retention-days: 7
